
name: EduSecure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # JOB 1 : Compilation et tests JUnit
  build-and-test:
    name: Java 25 - Maven - JUnit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'backend/**/pom.xml'

      - name: Verify environment
        run: |
          java -version
          mvn -version

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload API WAR
        uses: actions/upload-artifact@v4
        with:
          name: edusecure-api-war
          path: backend/edusecure-api/target/*.war
          if-no-files-found: error
          retention-days: 7

      - name: Upload PWA files
        uses: actions/upload-artifact@v4
        with:
          name: edusecure-pwa
          path: frontend/pwa/
          if-no-files-found: error
          retention-days: 7

  # JOB 2 : Detection des secrets avec Gitleaks
  gitleaks:
    name: Security - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
